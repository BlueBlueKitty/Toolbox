name: Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-windows.txt

      - name: Build Windows package
        shell: powershell
        run: .\scripts\build_win.ps1 -Clean -CreateInstaller

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist\*-Setup.exe
            dist\*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux builder image
        run: docker build -f docker/linux-release.Dockerfile -t toolbox-linux-builder .

      - name: Build Linux package inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            toolbox-linux-builder \
            bash -lc '
              python3 -m venv .venv --system-site-packages
              source .venv/bin/activate
              python -m pip install --upgrade pip setuptools wheel
              python -m pip install -r requirements-linux.txt
              chmod +x scripts/build_linux.sh
              ./scripts/build_linux.sh --clean
            '

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Read release metadata from version.json
        id: version_meta
        shell: python
        run: |
          import os
          import json
          from pathlib import Path

          data = json.loads(Path("version.json").read_text(encoding="utf-8"))
          name = data.get("name") or f'v{data["version"]}'
          body = data.get("changelog") or ""

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"release_name={name}\n")
              fh.write("release_body<<EOF\n")
              fh.write(body)
              fh.write("\nEOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: ${{ steps.version_meta.outputs.release_name }}
          body: ${{ steps.version_meta.outputs.release_body }}
