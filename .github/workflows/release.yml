name: Build And Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: toolbox-build
          auto-activate-base: false
          auto-update-conda: true
          environment-file: environment-build.yml
          miniforge-variant: Miniforge3
          use-mamba: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Verify Conda environment
        shell: pwsh
        run: |
          python --version
          python -c "from osgeo import gdal; print(gdal.VersionInfo())"

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_win.ps1 -Clean -CreateInstaller

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-release
          path: dist\Toolbox_*_windows_x86_64.exe
          if-no-files-found: error

  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux x86_64 builder image
        run: docker build -f docker/linux-release.Dockerfile -t toolbox-linux-builder:x86_64 .

      - name: Build Linux x86_64 package inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            toolbox-linux-builder:x86_64 \
            bash -lc '
              set -euo pipefail
              source /opt/conda/etc/profile.d/conda.sh
              conda env create -n toolbox-build -f environment-build.yml
              conda activate toolbox-build
              python --version
              python -c "from osgeo import gdal; print(gdal.VersionInfo())"
              chmod +x scripts/build_linux.sh
              ./scripts/build_linux.sh --clean --arch x86_64
            '

      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: dist/Toolbox-*_linux_x86_64.AppImage
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux arm64 builder image
        run: docker build -f docker/linux-release.Dockerfile -t toolbox-linux-builder:arm64 .

      - name: Build Linux arm64 package inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            toolbox-linux-builder:arm64 \
            bash -lc '
              set -euo pipefail
              source /opt/conda/etc/profile.d/conda.sh
              conda env create -n toolbox-build -f environment-build.yml
              conda activate toolbox-build
              python --version
              python -c "from osgeo import gdal; print(gdal.VersionInfo())"
              chmod +x scripts/build_linux.sh
              ./scripts/build_linux.sh --clean --arch arm64
            '

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-release
          path: dist/Toolbox-*_linux_arm64.AppImage
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS x86_64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: toolbox-build
          auto-activate-base: false
          auto-update-conda: true
          environment-file: environment-build.yml
          miniforge-variant: Miniforge3
          use-mamba: true

      - name: Verify Conda environment
        shell: bash -el {0}
        run: |
          python --version
          python -c "from osgeo import gdal; print(gdal.VersionInfo())"

      - name: Build macOS x86_64 package
        shell: bash -el {0}
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh --clean --arch x86_64

      - name: Upload macOS x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-release
          path: dist/Toolbox_*_apple_x86_64.dmg
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: toolbox-build
          auto-activate-base: false
          auto-update-conda: true
          environment-file: environment-build.yml
          miniforge-variant: Miniforge3
          use-mamba: true

      - name: Verify Conda environment
        shell: bash -el {0}
        run: |
          python --version
          python -c "from osgeo import gdal; print(gdal.VersionInfo())"

      - name: Build macOS arm64 package
        shell: bash -el {0}
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh --clean --arch arm64

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/Toolbox_*_apple_arm64.dmg
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-x86_64
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-x86_64
      - build-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets-flat
          find release-assets -maxdepth 3 -type f -exec cp {} release-assets-flat/ \;

      - name: Read release metadata from version.json
        id: version_meta
        shell: python
        run: |
          import os
          import json
          from pathlib import Path

          data = json.loads(Path("version.json").read_text(encoding="utf-8"))
          name = data.get("name") or f'v{data["version"]}'
          body = data.get("changelog") or ""

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"release_name={name}\n")
              fh.write("release_body<<EOF\n")
              fh.write(body)
              fh.write("\nEOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets-flat/*
          name: ${{ steps.version_meta.outputs.release_name }}
          body: ${{ steps.version_meta.outputs.release_body }}
